<div class="main-container">
  <div class="card access-container">
    <img src="/img/logo.png" alt="">
    <span class="error-text">{{errorMessage | translate}}</span>
    <input class="form-control" type="password" placeholder="{{ 'PAGES_A.ACCESS.CODE_PLACEHOLDER' | translate }}" [(ngModel)]="accessCode" (keydown.enter)="onSubmitAccess()">
    <br>
    <button class="btn btn-outline-primary" (click)="onSubmitAccess()">{{ 'PAGES_A.ACCESS.ACCESS_BTN' | translate }}</button>
  </div>

</div>

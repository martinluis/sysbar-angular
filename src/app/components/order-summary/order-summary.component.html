<div class="content-summary">
  <div class="header-summary dark-color">
    <span>{{headerTitle}}</span>
  </div>

  <div #contentSummary class="content-summary">
    @for (orderItem of order().items; track trackByItemId($index, orderItem)) {
      <app-order-item [orderItem]="orderItem" [order]="order()" (onUpdateItem)="onUpdateItems()" [isEditable]="isEditable()"/>
    }
    <br>
  </div>

  <div class="footer-summary">
    @if (isEditable()) {
      <div class="total-container d-flex align-items-center ">
        <div class="col-4 text-start px-2">
          <span>{{ 'COMPONENTS.ORDER.TOTAL' | translate }}</span>
        </div>
        <div class="col-8 text-end px-2">
          <span class="fw-bold">{{order().total| currency: 'USD'}}</span>
        </div>
      </div>
      <div class="actions-container d-flex">
        <button class="btn btn-success col-6" [disabled]="!isItemsModified || isSaving" (click)="onConfirm()">{{ 'COMPONENTS.COMMON.CONFIRM' | translate }}</button>
        <button class="btn btn-danger col-6" [disabled]="!isItemsModified || isSaving" (click)="onCancel()">{{ 'COMPONENTS.COMMON.CANCEL' | translate }}</button>
      </div>
    }
  </div>

</div>
<app-confirm-modal [showCancelButton]="true"/>

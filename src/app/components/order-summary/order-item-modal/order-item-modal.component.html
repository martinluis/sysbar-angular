@if (show) {
  <div class="modal-backdrop">
    <div class="modal-content">
      <br>
      <div class="actions-container row justify-content-center">
        <button class="btn btn-outline-primary col-2" [disabled]="item.quantity <= 1" (click)="onSubtract()">-</button>
        <span class="col-4">{{item.quantity}}</span>
        <button class="btn btn-outline-primary col-2" (click)="onAdd()">+</button>
      </div>
      <br>
        <div class="form-floating">
          <textarea class="form-control" [(ngModel)]="item.comment" [placeholder]="'COMPONENTS.ORDER.COMMENTS' | translate"></textarea>
          <label>{{ 'COMPONENTS.ORDER.COMMENTS' | translate }}</label>
        </div>
      <hr class="mb-4 mt-4">
      <div class="row justify-content-center">
        <button class="btn btn-primary col-5" (click)="confirm(true)">{{ 'COMPONENTS.COMMON.ACCEPT' | translate }}</button>
        <button class="btn btn-primary col-5 offset-1" (click)="confirm(false)">{{ 'COMPONENTS.COMMON.CANCEL' | translate }}</button>
      </div>
    </div>
  </div>
}
